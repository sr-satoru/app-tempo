name: 'Build and Release Desktop App'

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'universal-apple-darwin'
            args: '--target universal-apple-darwin --verbose'
            name: 'macOS'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            args: '--verbose'
            name: 'Linux'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: '--verbose'
            name: 'Windows'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies (GTK & WebKit)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install Node dependencies
        run: npm ci

      - name: Build Tauri App (Verbose com Publicação Oficial)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v__VERSION__' }}
          releaseName: 'Analize Dados ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v__VERSION__' }}'
          releaseBody: |
            ## Versão v__VERSION__ Compilada Multi-Plataforma
            
            Binários e instaladores oficiais gerados:
            - **Linux**: Pacotes `.deb` e executáveis portáveis `.AppImage`
            - **Windows**: Instalador `.msi` e executável `.exe`
            - **macOS**: Imagem de disco `.dmg` e bundle `.app` (Universal Apple Silicon & Intel)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Listar Arquivos Compilados no Log
        shell: bash
        run: |
          echo "========================================================"
          echo "       LISTAGEM DE ARQUIVOS GERADOS PELO BUILD          "
          echo "========================================================"
          find src-tauri/target -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.exe" -o -name "*.msi" -o -name "*.dmg" \) -exec ls -lh {} + || true

      - name: Upload Artifacts (Download direto na aba Actions)
        uses: actions/upload-artifact@v4
        with:
          name: analize-dados-${{ matrix.name }}
          path: |
            src-tauri/target/**/*.deb
            src-tauri/target/**/*.AppImage
            src-tauri/target/**/*.msi
            src-tauri/target/**/*.exe
            src-tauri/target/**/*.dmg
          if-no-files-found: warn
